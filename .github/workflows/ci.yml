name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  principles:
    name: principle lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/lint_principles.py

  python:
    name: python (reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: tests
        working-directory: impl/python
        run: PYTHONPATH=. python -m pytest tests/ -v
      - name: corpus is reproducible from the spec
        working-directory: impl/python
        run: |
          PYTHONPATH=. python tools/generate_vectors.py
          git diff --exit-code ../../conformance/vectors \
            || (echo "::error::conformance corpus is stale -- regenerate it" && exit 1)

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: impl/typescript
        run: npm install
      - working-directory: impl/typescript
        run: npm test

  julia:
    name: julia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: impl/julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: impl/julia

  lean:
    name: lean (proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: impl/lean
          build: true
          test: false
      - name: no sorry, no admit
        run: |
          if grep -rn --include=*.lean -E '\b(sorry|admit)\b' impl/lean; then
            echo "::error::a proof is incomplete"
            exit 1
          fi
          echo "no sorry/admit found"
